[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "visualdependence"
version = "1.0.0"
description = "An occlusion audit of whether a dual-encoder VLM's finding score depends on the finding's region"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.22", "scipy>=1.8", "scikit-learn>=1.1", "pandas>=1.5"]

[tool.setuptools]
packages = ["visualdependence"]
